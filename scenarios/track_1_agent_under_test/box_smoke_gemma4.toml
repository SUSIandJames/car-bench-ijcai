# Self-hosted vLLM (own H100/Blackwell box) — Gemma-4-31B-it, FP8, gemma4 tool parser.
# Reached via SSH tunnel: agent -> localhost:8010 -> box:8010 (vLLM).
# vLLM started without --api-key, so the bearer is a dummy (vLLM ignores it);
# we reuse HF_ENDPOINT_TOKEN env just to satisfy LiteLLM's need for *a* key.
# SMOKE: 1 task/type, 1 trial — confirm STRUCTURED tool_calls from the gemma4 parser.

[evaluator]
endpoint = "http://127.0.0.1:8081"
cmd = "python src/evaluator/server.py --host 127.0.0.1 --port 8081"

[agent_under_test]
endpoint = "http://127.0.0.1:8080"
cmd = "python src/track_1_agent_under_test/server.py --host 127.0.0.1 --port 8080 --agent-llm openai/google/gemma-4-31B-it --temperature 0.0 --api-base http://localhost:8010/v1 --api-key-env HF_ENDPOINT_TOKEN --sanitize-tool-schemas"

[config]
num_trials = 1
task_split = "train"
tasks_base_num_tasks = 1
tasks_hallucination_num_tasks = 1
tasks_disambiguation_num_tasks = 1
max_steps = 50
