# 3-WAY EXPERIMENT (A/B/C) — config A: BASELINE (current best, 0.80 config).
# 12 PREVIOUSLY-UNSEEN test tasks (4 per type, ids beyond the first-20 used so
# far), Pass^3 (3 trials each = 36 task-runs).
# Same 12 ids across all three configs A/B/C for a controlled comparison.
#   A = baseline: gemini-3.5-flash + 7-rule prompt + medium thinking, T=0.
#   B = A + --verify-mode code.
#   C = A + --suppress-tools planning_tool (no planning tool).

[evaluator]
endpoint = "http://127.0.0.1:8081"
cmd = "python src/evaluator/server.py --host 127.0.0.1 --port 8081"

[agent_under_test]
endpoint = "http://127.0.0.1:8080"
cmd = "python src/track_1_agent_under_test/server.py --host 127.0.0.1 --port 8080 --agent-llm gemini/gemini-3.5-flash --temperature 0.0 --thinking --reasoning-effort medium"

[config]
num_trials = 3
task_split = "test"
tasks_base_task_id_filter = ["base_41", "base_61", "base_81", "base_99"]
tasks_hallucination_task_id_filter = ["hallucination_41", "hallucination_61", "hallucination_81", "hallucination_97"]
tasks_disambiguation_task_id_filter = ["disambiguation_41", "disambiguation_43", "disambiguation_47", "disambiguation_49"]
max_steps = 50
