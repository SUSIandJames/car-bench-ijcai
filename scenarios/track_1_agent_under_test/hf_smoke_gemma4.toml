# HF Inference Endpoint — Gemma-4-31B-it via OpenAI-compatible TGI (ISOLATED).
# SMOKE: 1 task per type, 1 trial — run this FIRST to confirm the endpoint
# returns valid OpenAI-style tool_calls before committing to the full set.
#
# Fully separated from the existing Gemini/Opus/Ollama scenarios:
#   - model routed via openai/<model> + --api-base (no global OPENAI_* hijack)
#   - token read from env var HF_ENDPOINT_TOKEN (NOT in this file / not on CLI)
#   - --sanitize-tool-schemas strips additionalProperties (strict TGI parser)
# Add to .env:  HF_ENDPOINT_TOKEN=<your hf endpoint token>

[evaluator]
endpoint = "http://127.0.0.1:8081"
cmd = "python src/evaluator/server.py --host 127.0.0.1 --port 8081"

[agent_under_test]
endpoint = "http://127.0.0.1:8080"
cmd = "python src/track_1_agent_under_test/server.py --host 127.0.0.1 --port 8080 --agent-llm openai/google/gemma-4-31B-it --temperature 0.0 --api-base https://cw8ixquvm3pq879h.us-east-2.aws.endpoints.huggingface.cloud/v1 --api-key-env HF_ENDPOINT_TOKEN --sanitize-tool-schemas"

[config]
num_trials = 1
task_split = "train"
tasks_base_num_tasks = 1
tasks_hallucination_num_tasks = 1
tasks_disambiguation_num_tasks = 1
max_steps = 50
