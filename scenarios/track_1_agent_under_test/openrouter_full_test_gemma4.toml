# OpenRouter — Gemma-4-31B-it. FULL public test split: ALL tasks
# (base 50 + hall 50 + disamb 25 = 125) × 3 trials = 375 runs.
# First complete, statistically meaningful Pass^3 for our best OSS model.
# Tool-calling confirmed working via OpenRouter (smoke: structured tool_calls,
# 0 errors, ~27 s/task-trial → full set ≈ 3 h). OPENROUTER_API_KEY from .env.

[evaluator]
endpoint = "http://127.0.0.1:8081"
cmd = "python src/evaluator/server.py --host 127.0.0.1 --port 8081"

[agent_under_test]
endpoint = "http://127.0.0.1:8080"
cmd = "python src/track_1_agent_under_test/server.py --host 127.0.0.1 --port 8080 --agent-llm openrouter/google/gemma-4-31b-it --temperature 0.0 --sanitize-tool-schemas --openrouter-provider DeepInfra,Ambient,Chutes"

[config]
num_trials = 3
task_split = "test"
tasks_base_num_tasks = -1
tasks_hallucination_num_tasks = -1
tasks_disambiguation_num_tasks = -1
max_steps = 50
